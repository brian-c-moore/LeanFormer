name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least-privilege token. This workflow only needs to read repo contents.
permissions:
  contents: read

# Cancel in-progress runs when a new push lands on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      # Third-party and first-party actions are pinned to full commit SHAs.
      # Tag comments (e.g. v4.2.2) are informational — only the SHA is trusted.
      # Refresh SHAs periodically via `git ls-remote https://github.com/<action> refs/tags/<tag>`.
      - name: Check out repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2
        with:
          persist-credentials: false

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405  # v6.2.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Cache HuggingFace models
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            hf-${{ runner.os }}-py${{ matrix.python-version }}-

      - name: Run unit tests
        run: |
          python -m pytest tests/ -v --timeout=300 -k "not test_integration and not test_trained_model"
