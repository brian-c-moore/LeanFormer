model:
  vocab_size: 32000
  d_model: 1536
  n_heads: 24
  n_layers: 20
  d_ff: 6144
  max_seq_len: 512
  attention_rank: 192
  ff_rank: 192
  screening_rank: 48
  attention_top_k: 96
  ff_gate_rank: 48
  ff_sparsity_target: 0.8
  min_depth: 6
  exit_threshold: 0.03
  dropout: 0.1

data:
  tokenizer: mistralai/Mistral-7B-v0.1
  max_seq_len: 512

training:
  output_dir: ./checkpoints/reasoning_core
  epochs: 1
  batch_size: 1
  gradient_accumulation: 64
  lr: 2.0e-4
  warmup_steps: 1000
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: true
  logging_steps: 100
  save_steps: 2000
  eval_steps: 500
  run_name: leanformer-reasoning-core-204m
