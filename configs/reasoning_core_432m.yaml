model:
  vocab_size: 32000
  d_model: 2048
  n_heads: 32
  n_layers: 24
  d_ff: 8192
  max_seq_len: 512
  attention_rank: 256
  ff_rank: 256
  screening_rank: 64
  attention_top_k: 128
  ff_gate_rank: 64
  ff_sparsity_target: 0.8
  min_depth: 6
  exit_threshold: 0.03
  dropout: 0.1

data:
  tokenizer: mistralai/Mistral-7B-v0.1
  max_seq_len: 512

training:
  output_dir: ./checkpoints/reasoning_core
  epochs: 3
  batch_size: 2
  gradient_accumulation: 32
  lr: 2.0e-4
  warmup_steps: 3000
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: true
  logging_steps: 100
  save_steps: 5000
  eval_steps: 1000
  run_name: leanformer-reasoning-core-432m
