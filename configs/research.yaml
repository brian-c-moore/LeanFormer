model:
  vocab_size: 32000
  d_model: 256
  n_heads: 4
  n_layers: 6
  d_ff: 1024
  max_seq_len: 512
  attention_rank: 24
  ff_rank: 24
  screening_rank: 6
  attention_top_k: 48
  ff_gate_rank: 6
  ff_sparsity_target: 0.75
  min_depth: 2
  exit_threshold: 0.02
  dropout: 0.1

data:
  tokenizer: mistralai/Mistral-7B-v0.1
  samples_per_source: 20000

training:
  output_dir: ./checkpoints/research
  epochs: 2
  batch_size: 16
  gradient_accumulation: 4
  lr: 3.0e-4
  warmup_steps: 200
  run_name: leanformer-research
  use_wandb: false
