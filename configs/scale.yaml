model:
  vocab_size: 50257
  d_model: 512
  n_heads: 8
  n_layers: 12
  d_ff: 2048
  max_seq_len: 512
  attention_rank: 64
  ff_rank: 64
  screening_rank: 16
  attention_top_k: 64
  ff_gate_rank: 16
  ff_sparsity_target: 0.8
  min_depth: 4
  exit_threshold: 0.02
  dropout: 0.1

data:
  tokenizer: gpt2
  dataset: openwebtext
  max_samples: 500000
  max_seq_len: 512

training:
  output_dir: ./checkpoints/scale
  epochs: 1
  batch_size: 2
  gradient_accumulation: 32
  lr: 3.0e-4
  warmup_steps: 2000
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: true
  logging_steps: 100
  save_steps: 5000
  eval_steps: 1000
  run_name: leanformer-scale-v1
