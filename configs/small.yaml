model:
  vocab_size: 32000
  d_model: 512
  n_heads: 8
  n_layers: 12
  d_ff: 2048
  max_seq_len: 1024
  attention_rank: 32
  ff_rank: 32
  screening_rank: 8
  attention_top_k: 64
  ff_gate_rank: 8
  ff_sparsity_target: 0.8
  min_depth: 2
  exit_threshold: 0.01
  dropout: 0.1

data:
  tokenizer: mistralai/Mistral-7B-v0.1
  samples_per_source: 100000

training:
  output_dir: ./checkpoints/small
  epochs: 3
  batch_size: 8
  gradient_accumulation: 8
  lr: 3.0e-4
  warmup_steps: 1000
  run_name: leanformer-small-v1
  use_wandb: true
